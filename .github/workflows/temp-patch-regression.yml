name: Temp patch regression

on:
  push:
    branches:
      - sync/lovable-2026-09-26-3-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/lovable-2026-09-26-3-clean

      - name: Apply regression updates from private snapshot
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/__tests__/regression.test.ts")
          text = path.read_text(encoding="utf-8")

          old_config = '''      bleedMode: "compartilhada",
          });'''
          new_config = '''      bleedMode: "compartilhada",
            registrationWhiteBorderMm: 1,
          });'''
          if old_config not in text:
              raise SystemExit("Target config block not found")
          text = text.replace(old_config, new_config, 1)

          marker = '''    expect(grid.perSheet).toBe(8);
          });

          it("centraliza uma carta sem reservar os outros sete espaços da grade", () => {'''
          inserted = '''    expect(grid.perSheet).toBe(8);
          });

          it("a grade automatica nunca coloca carta dentro da borda branca das marcas", () => {
            const config = {
              ...DEFAULT_COMPOSER_CONFIG,
              cardWidthMm: 57,
              cardHeightMm: 89,
              bleedMm: 5,
              gapMm: 2,
              bleedMode: "compartilhada" as const,
            };
            const cards = Array.from({ length: 8 }, (_, i) => ({
              id: `c${i}`,
              frontImageId: "x",
              backImageId: null,
              selected: true,
            }));
            const sheet = layoutSheets(cards, config)[0];
            for (const p of sheet?.placements ?? []) {
              expect(
                cutRectHitsRegistrationArea(p.cutRectMm, A4_W, A4_H, config.registrationWhiteBorderMm),
              ).toBe(false);
            }
          });

          it("centraliza uma carta sem reservar os outros sete espaços da grade", () => {'''
          if marker not in text:
              raise SystemExit("Target test marker not found")
          text = text.replace(marker, inserted, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-patch-regression.yml
          git config user.name "Eron Greco Melo"
          git config user.email "92898024+eronGreco@users.noreply.github.com"
          git add src/__tests__/regression.test.ts .github/workflows/temp-patch-regression.yml
          git commit -m "test: align regression expectations with Cameo safety border"
          git push origin HEAD:sync/lovable-2026-09-26-3-clean
