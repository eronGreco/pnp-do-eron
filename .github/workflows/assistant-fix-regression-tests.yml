name: Assistant fix registration regression tests

on:
  push:
    branches:
      - sync-2026-09-26-2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore original regression suite and update two expectations
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          original = subprocess.check_output([
              "git", "show", "origin/main:src/__tests__/regression.test.ts"
          ], text=True)

          old1 = '''    // Quadrado: fundo cobre a zona pontilhada do sensor (inset + braco + borda).\n    expect(backdrops[0]).toEqual(rect(8, 8, 22, 22));'''
          new1 = '''    // Quadrado 5x5: a borda acompanha somente o próprio quadrado.\n    expect(backdrops[0]).toEqual(rect(8, 8, 17, 17));'''
          old2 = '''    const nearSquare = rect(22, 10, 74, 62);'''
          new2 = '''    const nearSquare = rect(20, 10, 72, 62);'''

          if old1 not in original or old2 not in original:
              raise SystemExit("Trechos esperados não encontrados no regression.test.ts original")

          fixed = original.replace(old1, new1, 1).replace(old2, new2, 1)
          Path("src/__tests__/regression.test.ts").write_text(fixed, encoding="utf-8")

      - name: Commit targeted test fix
        run: |
          rm -f .github/workflows/assistant-fix-regression-tests.yml
          git config user.name "Eron Greco Melo"
          git config user.email "92898024+eronGreco@users.noreply.github.com"
          git add src/__tests__/regression.test.ts .github/workflows/assistant-fix-regression-tests.yml
          git commit -m "test: align registration mark regressions with new geometry"
          git push origin HEAD:sync-2026-09-26-2
