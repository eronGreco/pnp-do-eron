name: Assistant public snapshot

on:
  push:
    branches:
      - sync-2026-09-26

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive public branch
        run: |
          tar -czf /tmp/pnp-public-current.tar.gz --exclude=.git .
      - name: Upload public snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pnp-public-current
          path: /tmp/pnp-public-current.tar.gz
          retention-days: 1
