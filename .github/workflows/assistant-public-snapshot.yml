name: Assistant source sync

on:
  push:
    branches:
      - sync-2026-09-26

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download filtered private source
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3684-820e-8321-08ca1b999350/raw?se=2026-09-26T08%3A02%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=36e6ecd6-367a-5478-8370-8eef6bd28a87&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T18%3A34%3A37Z&ske=2026-09-26T18%3A34%3A37Z&sks=b&skv=2026-02-06&sig=okWjK0FYY8OPgZM9XRt3FFiXfEi0baFRpLMCSeTFwzY%3D"
        run: |
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/private-source.zip
          mkdir -p /tmp/private-artifact /tmp/private-source
          unzip -q /tmp/private-source.zip -d /tmp/private-artifact
          tar -xzf /tmp/private-artifact/pnp-public-source.tar.gz -C /tmp/private-source
      - name: Apply functional source updates
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "/tmp/private-source/$path" "$path"
          done <<'PATHS'
          src/__tests__/regression.test.ts
          src/__tests__/sheetAndExport.test.ts
          src/cameo/types.ts
          src/components/CutConfirmDialog.tsx
          src/components/LayoutPreview.tsx
          src/components/PreviewCanvas.tsx
          src/components/SizeAuditBanner.tsx
          src/components/StudioSidebar.tsx
          src/components/panels/AdvancedSection.tsx
          src/components/panels/BleedPanel.tsx
          src/components/panels/BuildPanel.tsx
          src/components/panels/CricutMarksPanel.tsx
          src/components/panels/CutExportPanel.tsx
          src/components/panels/DisabledConfig.tsx
          src/components/panels/Field.tsx
          src/components/panels/FinishPanel.tsx
          src/components/panels/GridPanel.tsx
          src/components/panels/MarksPanel.tsx
          src/components/panels/SheetPanel.tsx
          src/components/panels/SizePanel.tsx
          src/components/panels/SlicerPanel.tsx
          src/components/panels/SlicerSliderField.tsx
          src/composer/buildSheetPdf.ts
          src/composer/layoutSheets.ts
          src/composer/markCoverage.ts
          src/composer/packingPolicy.ts
          src/composer/types.ts
          src/composer/useComposer.ts
          src/cricut/markTemplate.ts
          src/help/helpTopics.ts
          src/pdf/jobManifest.ts
          src/routes/index.tsx
          src/slicer/sliceGeometry.ts
          src/slicer/sliceImages.ts
          src/slicer/types.ts
          src/slicer/useSlicer.ts
          src/start.ts
          src/state/useWorkspace.ts
          src/storage/composerStore.ts
          src/storage/settings.ts
          PATHS

          rm -f src/components/panels/CricutDiagnosticsPanel.tsx
          rm -f src/lib/cricutDiagnostics.functions.ts
          rm -rf src/integrations/supabase
          rm -f .env.example
      - name: Clean public dependencies and Vite config
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const dep of ['@ai-sdk/openai', '@ai-sdk/openai-compatible', 'ai', '@supabase/supabase-js']) {
            delete p.dependencies[dep];
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          let vite = fs.readFileSync('vite.config.ts', 'utf8');
          vite = vite.replace(
            'include: ["react", "react-dom", "react-dom/client", "@radix-ui/react-accordion"],',
            'include: [\n      "react",\n      "react-dom",\n      "react-dom/client",\n      "@radix-ui/react-accordion",\n      "@radix-ui/react-collapsible",\n    ],'
          );
          fs.writeFileSync('vite.config.ts', vite);
          NODE
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/assistant-public-snapshot.yml
          git config user.name "Eron Greco Melo"
          git config user.email "92898024+eronGreco@users.noreply.github.com"
          git add -A
          git commit -m "feat: sync major print and cutting improvements"
          git push origin HEAD:sync-2026-09-26
