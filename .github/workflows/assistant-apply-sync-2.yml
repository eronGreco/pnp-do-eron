name: Assistant apply public sync 2

on:
  push:
    branches:
      - sync-2026-09-26-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply functional patches
        run: |
          for patch in .sync/sync2-00.patch .sync/sync2-01.patch .sync/sync2-02.patch .sync/sync2-03.patch .sync/sync2-04.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Apply public documentation and bridge adjustments
        run: python .sync/apply_sync.py

      - name: Commit synchronized public source
        run: |
          rm -rf .sync
          rm -f .github/workflows/assistant-apply-sync-2.yml
          git config user.name "Eron Greco Melo"
          git config user.email "92898024+eronGreco@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve Cricut alignment, Cameo marks and paper formats"
          git push origin HEAD:sync-2026-09-26-2
